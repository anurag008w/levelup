name: Release

on:
  # Trigger on version tags in format vYYYY.MM.DD (e.g., v2026.08.01)
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
  # Allow manual trigger with custom tag
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g., v2026.08.01)"
        required: true
        default: "v2026.08.01"

permissions:
  contents: write

# Cancel in-progress runs on same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version tag
        id: version
        run: |
          if [[ "${{ github.event.inputs.version_tag }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release APK
        id: apk
        run: |
          mkdir -p release-out
          
          # Get git info for release notes
          git fetch --tags
          TAGS=$(git tag --sort=-v:refname | head -5 | tr '\n' ' ')
          
          # Count commits since last release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            COMMITS_SINCE=$(git log $LAST_TAG..HEAD --oneline | wc -l | tr -d ' ')
          else
            COMMITS_SINCE=$(git rev-list --count HEAD)
          fi
          
          # Get last 5 commit messages
          CHANGES=$(git log --oneline -5 | sed 's/^[a-f0-9]* /- /')
          
          NAME="human-os-{{ steps.version.outputs.VERSION_NAME }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-out/${NAME}"
          
          echo "apk_path=release-out/${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "commits_since=${COMMITS_SINCE}" >> "$GITHUB_OUTPUT"
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Get commit messages since last version tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [[ -n "$LAST_TAG" ]]; then
            echo "### Changes since $LAST_TAG" > changelog.md
            echo '```' >> changelog.md
            git log $LAST_TAG..HEAD --format="- %s" >> changelog.md
            echo '```' >> changelog.md
          else
            echo "### Initial Release" > changelog.md
            echo '```' >> changelog.md
            git log --oneline -10 --format="- %s" >> changelog.md
            echo '```' >> changelog.md
          fi
          
          # Add APK download info
          echo "" >> changelog.md
          echo "### 📱 Install APK" >> changelog.md
          echo "Download the APK below and install it on your Android phone." >> changelog.md
          echo "" >> changelog.md
          echo "**Note:** You may need to enable 'Install from unknown sources' in your phone settings." >> changelog.md
          
          cat changelog.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: human-os-${{ steps.version.outputs.VERSION_NAME }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Human OS ${{ steps.version.outputs.VERSION }}"
          body_path: changelog.md
          prerelease: false
          make_latest: true
          files: ${{ steps.apk.outputs.apk_path }}

      - name: Notify success
        run: |
          echo "🎉 Release ${{ steps.version.outputs.VERSION }} created successfully!"
          echo "📦 APK: ${{ steps.apk.outputs.apk_name }}"
          echo "📝 Changes: ${{ steps.apk.outputs.commits_since }} commits since last release"
