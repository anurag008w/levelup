name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v2026.08.01)"
        required: false
        default: ""

# Build work runs with read-only repository access. Only the final publish job
# receives contents: write, after all untrusted dependency/build steps finish.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
      version_code: ${{ steps.version.outputs.VERSION_CODE }}
      previous_tag: ${{ steps.prev_tag.outputs.PREVIOUS_TAG }}
      apk_name: ${{ steps.prepare.outputs.apk_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set version
        id: version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$RELEASE_INPUT_VERSION"
            if [[ -z "$VERSION" ]]; then
              echo "❌ Manual workflow run ke liye version chahiye (e.g. 2026.09.7004)"
              exit 1
            fi
            if [[ ! "$VERSION" =~ ^v ]]; then
              VERSION="v$VERSION"
            fi
          fi
          VERSION_NAME="${VERSION#v}"

          # Keep the workflow parser aligned with scripts/release-version.mjs:
          # YYYY.MM.DD or YYYY.MM.DDSS, with at most four digits in the final
          # component. The updater and Android versionCode parser both split
          # the final component after its first two digits, so silently
          # accepting a longer value would produce an ambiguous release.
          if [[ ! "$VERSION_NAME" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{1,4}$ ]]; then
            echo "❌ Invalid app version '$VERSION_NAME' — expected YYYY.MM.DD or YYYY.MM.DDSS (max 4 digits in the final component)"
            exit 1
          fi

          YEAR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          MONTH="${REST%%.*}"
          DAYSEQ="${REST#*.}"
          if [[ ${#DAYSEQ} -gt 2 ]]; then
            DAY="${DAYSEQ:0:2}"
            SEQ="${DAYSEQ:2:2}"
          else
            DAY="$DAYSEQ"
            SEQ="00"
          fi
          VERSION_CODE="${YEAR}${MONTH}${DAY}${SEQ}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "📌 Release: $VERSION (versionCode $VERSION_CODE)"

      - name: Determine previous tag
        id: prev_tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | head -1 || echo "")
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "📎 Previous tag for changelog comparison: $PREVIOUS_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION_NAME }}
          VITE_DEFAULT_AI_BASE_URL: ${{ secrets.VITE_DEFAULT_AI_BASE_URL }}
          VITE_DEFAULT_AI_API_KEY: ${{ secrets.VITE_DEFAULT_AI_API_KEY }}
          VITE_DEFAULT_AI_MODEL: ${{ secrets.VITE_DEFAULT_AI_MODEL }}
          VITE_DEFAULT_AI_MODELS: ${{ secrets.VITE_DEFAULT_AI_MODELS }}
          VITE_DEFAULT_AI_TEMPERATURE: ${{ secrets.VITE_DEFAULT_AI_TEMPERATURE }}
          VITE_DEFAULT_AI_MAX_TOKENS: ${{ secrets.VITE_DEFAULT_AI_MAX_TOKENS }}
          VITE_DEFAULT_AI_TIMEOUT_MS: ${{ secrets.VITE_DEFAULT_AI_TIMEOUT_MS }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "❌ Production release signing credentials are required; refusing to publish an unsigned debug APK."
            exit 1
          fi

          echo "$KEYSTORE" | base64 -d > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=levelup" >> android/keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/keystore.properties
          echo "storeType=pkcs12" >> android/keystore.properties

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.version.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Prepare APK
        id: prepare
        run: |
          mkdir -p release-out
          APK_NAME="levelup-${{ steps.version.outputs.VERSION_NAME }}-signed.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-out/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      # Build artifacts are transferred to the separate publish job. The
      # write-capable GitHub token is therefore unavailable during npm ci,
      # web/Android builds, signing, and artifact preparation.
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: levelup-${{ steps.version.outputs.VERSION_NAME }}-apk
          path: release-out
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: levelup-${{ needs.build.outputs.version_name }}-apk
          path: release-out

      - name: Generate changelog
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_APK_NAME: ${{ needs.build.outputs.apk_name }}
          LAST_TAG: ${{ needs.build.outputs.previous_tag }}
        run: |
          cat > changelog.md << 'CHANGELOG'
          # Release ${RELEASE_VERSION}

          ## 📱 Download APK
          Install the signed release APK on your Android device.

          - **APK:** `${RELEASE_APK_NAME}`

          CHANGELOG

          cat >> changelog.md << 'CHANGELOG'

          ## 📝 Changes

          CHANGELOG

          if [[ -n "$LAST_TAG" ]]; then
            echo "### Changes since $LAST_TAG" >> changelog.md
            git log --format="- %s" --end-of-options "$LAST_TAG..HEAD" >> changelog.md
          fi

      # Only this final publishing job has contents: write. It creates the tag
      # and release after build, signing, artifact transfer, and changelog
      # preparation have all succeeded.
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "LevelUp ${{ needs.build.outputs.version }}"
          body_path: changelog.md
          files: release-out/${{ needs.build.outputs.apk_name }}

      - name: Done
        run: |
          echo "🎉 Release ${{ needs.build.outputs.version }} created!"
          echo "📦 Signed APK: ${{ needs.build.outputs.apk_name }}"
