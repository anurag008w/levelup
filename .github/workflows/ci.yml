name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'fix/*'
      - 'release/*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure git
        run: |
          git config user.email "anurag008w@users.noreply.github.com"
          git config user.name "anurag008w"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      - name: Type check
        run: npm run typecheck || npx tsc --noEmit

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_DEFAULT_AI_BASE_URL: ${{ secrets.VITE_DEFAULT_AI_BASE_URL }}
          VITE_DEFAULT_AI_API_KEY: ${{ secrets.VITE_DEFAULT_AI_API_KEY }}
          VITE_DEFAULT_AI_MODEL: ${{ secrets.VITE_DEFAULT_AI_MODEL }}
          VITE_DEFAULT_AI_MODELS: ${{ secrets.VITE_DEFAULT_AI_MODELS }}
          VITE_DEFAULT_AI_AUTH: ${{ secrets.VITE_DEFAULT_AI_AUTH }}
        run: npm run build

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        # cap sync koppies dist/ into the Android project — build it first.
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Android unit tests and debug APK
        working-directory: android
        run: ./gradlew test assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: levelup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
